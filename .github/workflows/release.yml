name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

# This job pushes to main; two tags in quick succession must not race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff reads history and tags straight from the object database;
          # a shallow clone yields a near-empty changelog without erroring.
          fetch-depth: 0
          # A tag push checks out detached HEAD, which cannot be pushed from.
          ref: main

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          args: --output CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip all --output release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changelog
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # No-op when the changelog was already generated in the release commit.
          git diff --staged --quiet || \
            git commit -m "chore(changelog): update for ${GITHUB_REF_NAME} [skip ci]"
          git push origin main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
